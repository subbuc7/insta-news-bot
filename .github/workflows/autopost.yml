name: Auto Post News to Instagram

on:
  schedule:
    # Runs automatically every 1 hour (at minute 15 past the hour to avoid GitHub queue delays)
    - cron: '15 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to save and commit posted_history.json

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: Run News Bot
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID || secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TRIGGER_TYPE: ${{ github.event_name }}
        run: |
          python autopost.py

      - name: Save History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted history [skip ci]" && git push)
          
