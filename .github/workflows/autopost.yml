name: Auto Post AP & TS News to Instagram

on:
  schedule:
    # Runs at 8:00 AM, 1:00 PM, and 7:00 PM IST (2:30, 7:30, 13:30 UTC)
    - cron: '30 2,7,13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Fonts & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-noto-core fonts-telu
          pip install pillow requests

      - name: Run News Bot
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python autopost.py

      - name: Save History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted history [skip ci]" && git push)
