name: Auto Post News to Instagram

on:
  schedule:
    # Runs at :01 past every 2 hours in IST (02:01, 04:01, 06:01, 08:01, 10:01, 12:01, etc.)
    - cron: '31 */2 * * *'
  workflow_dispatch: # Allows manual trigger anytime from Actions tab

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Fonts & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-telu fonts-noto-core
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: Run News Bot
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID || secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TRIGGER_TYPE: ${{ github.event_name }}
        run: |
          python autopost.py

      - name: Save History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted history [skip ci]" && git push)
