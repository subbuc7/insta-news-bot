name: Auto Post 5-Slide News Carousel to Instagram

on:
  schedule:
    # Runs automatically every hour (GitHub Actions cron limit)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual run backup if ever needed

jobs:
  run-carousel-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pillow requests

      - name: Run News Bot
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python autopost.py

      - name: Commit Deduplication History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted history [skip ci]" && git push)
          
